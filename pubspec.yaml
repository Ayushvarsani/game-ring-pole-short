name: color_short
description: "Water Sort Puzzle Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.4
  audioplayers: ^6.6.0
  url_launcher: ^6.3.2
  google_mobile_ads: ^8.0.0
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Firebase dependencies - uncomment when Firebase is configured:
  # firebase_core: ^3.13.0
  # firebase_analytics: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.dev
    - .env.prod
    - assets/images/
    - assets/images/flip_fun_blast.png
    - assets/audio/tap.wav
    - assets/audio/pour.wav
    - assets/audio/win.wav
    - assets/audio/fail.wav
    - assets/audio/bottle_solved.wav
    - assets/audio/bgm.wav
